<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Reslink mark, lifted from public/reslink-logo.svg.

       That file is the full lockup (334x78, plane + RESLINK wordmark), which
       is illegible at 16px — the wordmark collapses to a smear. This is the
       plane alone: the two paths that make it, translated so their bounding
       box (x 1.48-65.16, y 17.66-68.84) is centred in a square with even
       padding, so the mark reads as large as it can at tab size.

       The lockup's clipPath is dropped rather than carried over: its rect
       fully contains the mark, so it was never clipping anything here.

       Next serves this as the <link rel="icon"> automatically because it
       lives at src/app/icon.svg. -->
